<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kacper Liberda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { color: #000; -webkit-font-smoothing: antialiased; }

  nav {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 0 clamp(12px, 3.2vw, 56px);
    padding: clamp(18px, 3vw, 40px) 16px clamp(10px, 1.6vw, 22px);
  }
  nav a {
    font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
    font-size: clamp(22px, 4.6vw, 64px);
    line-height: 1.05; letter-spacing: .01em;
    color: #000; text-decoration: none; cursor: pointer;
  }
  nav a[aria-current="true"] {
    text-decoration: underline;
    text-decoration-thickness: .055em;
    text-underline-offset: .09em;
  }
  nav a:focus-visible { outline: 2px solid #000; outline-offset: 4px; }

  #stage { position: relative; margin: 0 auto; width: calc(100% - 32px); max-width: 1800px; }
  #stage > * {
    position: absolute; display: block;
    opacity: 0; transition: opacity .5s ease;
  }
  /* cut-outs sit on white: multiply lets their empty corners tuck under neighbours */
  #stage > .cut { mix-blend-mode: multiply; }
  #stage > .on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #stage > * { transition: none; } }
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="stage"></main>

<script src="data.js"></script>
<script>
(function () {
  var nav = document.getElementById('nav');
  var stage = document.getElementById('stage');
  var cats = window.PORTFOLIO || [];
  var current = null, seed = 1, order = [];

  // small seeded RNG so a resize keeps the same arrangement
  function rng(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  cats.forEach(function (c) {
    var a = document.createElement('a');
    a.textContent = c.name;
    a.href = '#' + c.id;
    nav.appendChild(a);
  });

  function shuffle(n, rand) {
    var a = []; for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) {
      var k = Math.floor(rand() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  // Tight scatter. Items get random sizes and are slid into the highest free
  // spot (big ones first, small ones fill holes); then each one is pulled up and
  // grown until it meets its neighbours, so little air is left.
  // Cut-outs carry their outline (it.t / it.b = top / bottom edge per column),
  // so they nest into each other's shapes; drawn pixels never overlap.
  function layout() {
    if (!current) return;
    var rand = rng(seed * 7919 + 13);
    var W = stage.clientWidth;
    var small = W < 620, mid = W < 1050;
    var CELL = 2, cols = Math.max(1, Math.floor(W / CELL));
    var gFrame = Math.max(4, W * (small ? 0.011 : 0.0042));  // gap around photos / framed renders
    var gCut = Math.max(2, W * (small ? 0.005 : 0.0016));    // gap around cut-outs
    var aMin = small ? 0.16 : mid ? 0.055 : 0.022;           // item area as share of W*W
    var aMax = small ? 0.34 : mid ? 0.12 : 0.062;
    var maxN = Math.floor(W * (small ? 0.82 : mid ? 0.5 : 0.36) / CELL);
    var growN = Math.min(cols, Math.floor(W * (small ? 0.96 : mid ? 0.62 : 0.44) / CELL));
    var c, k;

    // a slightly uneven invisible ceiling, so the first row is not ruler-straight
    var lip = new Float32Array(cols);
    for (c = 0; c < cols;) {
      var seg = Math.max(8, Math.round(cols * (0.06 + rand() * 0.12))), l = rand() * W * 0.018;
      for (k = c; k < Math.min(cols, c + seg); k++) lip[k] = l;
      c += seg;
    }
    function fresh(skip) {             // taken [from, to] spans per column, without item `skip`
      var occ = [], i;
      for (i = 0; i < cols; i++) occ.push([[-1e6, lip[i]]]);
      items.forEach(function (o) { if (o !== skip && o.s) claim(occ, o.s, o.d, o.x0, o.y); });
      return occ;
    }
    function shape(o, n) {             // outline at a width of n columns, padded by half a gap
      var it = o.it, hh = n * CELL / o.ar, half = o.g / 2, d = o.d, m = n + 2 * d;
      var top = new Float32Array(m), bot = new Float32Array(m), i, j, q, lo, hi, tt, bb;
      for (i = 0; i < m; i++) {
        lo = 1e9; hi = -1e9;
        for (j = Math.max(0, i - 2 * d); j <= Math.min(n - 1, i); j++) {
          if (it.t) {
            q = Math.min(it.t.length - 1, Math.floor((j + 0.5) / n * it.t.length));
            if (it.t[q] < 0) continue;
            tt = it.t[q] / 100 * hh; bb = it.b[q] / 100 * hh;
          } else { tt = 0; bb = hh; }
          if (tt < lo) lo = tt; if (bb > hi) hi = bb;
        }
        if (hi === -1e9) { top[i] = 0; bot[i] = -1e9; } else { top[i] = lo - half; bot[i] = hi + half; }
      }
      return { n: n, h: hh, m: m, top: top, bot: bot };
    }
    function drop(occ, s, d, x0, y) {  // highest free y (not above y) for shape s at x0
      var moved = true, i, j, col, a, b2, list;
      while (moved) {
        moved = false;
        for (i = 0; i < s.m; i++) {
          if (s.bot[i] === -1e9) continue;
          col = x0 - d + i;
          if (col < 0 || col >= cols) continue;
          list = occ[col]; a = y + s.top[i]; b2 = y + s.bot[i];
          for (j = 0; j < list.length; j++) {
            if (list[j][0] < b2 && list[j][1] > a) {
              y = list[j][1] - s.top[i]; a = y + s.top[i]; b2 = y + s.bot[i]; moved = true;
            }
          }
        }
      }
      return y;
    }
    function isFree(occ, s, d, x0, y) {
      var i, j, col, a, b2, list;
      for (i = 0; i < s.m; i++) {
        if (s.bot[i] === -1e9) continue;
        col = x0 - d + i;
        if (col < 0 || col >= cols) continue;
        list = occ[col]; a = y + s.top[i]; b2 = y + s.bot[i];
        for (j = 0; j < list.length; j++) if (list[j][0] < b2 && list[j][1] > a) return false;
      }
      return true;
    }
    function claim(occ, s, d, x0, y) {
      for (var i = 0; i < s.m; i++) {
        var col = x0 - d + i;
        if (s.bot[i] === -1e9 || col < 0 || col >= cols) continue;
        occ[col].push([y + s.top[i], y + s.bot[i]]);
      }
    }

    // sizes first, then order: bigger before smaller (with some noise)
    var items = order.map(function (idx) {
      var it = current.items[idx], ar = it.w / it.h;
      var area = (aMin + rand() * (aMax - aMin)) * W * W;
      var n = Math.max(1, Math.min(maxN, cols, Math.round(Math.sqrt(area * ar) / CELL)));
      var g = it.t ? gCut : gFrame;
      return { it: it, el: stage.children[idx], ar: ar, g: g, d: Math.max(1, Math.ceil(g / 2 / CELL)),
               n0: n, key: n * n / ar * (0.55 + rand() * 0.9), s: null, x0: 0, y: 0 };
    });
    items.sort(function (p, q) { return q.key - p.key; });

    // 1. place
    var step = Math.max(1, Math.round(cols / 220)), occ = fresh(null);
    items.forEach(function (o) {
      var s = shape(o, o.n0), n = s.n, best = null, mid2 = (cols - n) / 2, x0, y, cost;
      for (x0 = 0; x0 <= cols - n; x0 += step) {
        y = drop(occ, s, o.d, x0, 0);
        cost = y + Math.abs(x0 - mid2) * CELL * 0.02 + rand() * s.h * 0.05;
        if (!best || cost < best.cost) best = { x0: x0, y: y, cost: cost };
      }
      o.s = s; o.x0 = best.x0; o.y = best.y;
      claim(occ, s, o.d, o.x0, o.y);
    });

    function settle() {                // pull everything up as far as it goes
      items.slice().sort(function (p, q) { return p.y - q.y; }).forEach(function (o) {
        o.y = drop(fresh(o), o.s, o.d, o.x0, 0);
      });
    }
    function squeeze() {               // slide everything sideways towards the middle
      var mid2 = cols / 2;
      items.slice().sort(function (p, q) {
        return Math.abs(p.x0 + p.s.n / 2 - mid2) - Math.abs(q.x0 + q.s.n / 2 - mid2);
      }).forEach(function (o) {
        var oc = fresh(o), dir = o.x0 + o.s.n / 2 < mid2 ? 1 : -1, x = o.x0, lim = Math.abs(mid2 - (o.x0 + o.s.n / 2));
        while (lim-- > 0 && x + dir >= 0 && x + dir <= cols - o.s.n && isFree(oc, o.s, o.d, x + dir, o.y)) x += dir;
        o.x0 = x;
      });
    }
    function grow() {                  // enlarge each item until it meets a neighbour
      shuffle(items.length, rand).forEach(function (i) {
        var o = items[i], oc = fresh(o), n = o.s.n, hh = o.s.h, bestFit = null;
        // keep the centre or one of the corners fixed, whichever lets it grow most
        [[0.5, 0.5], [0, 0], [1, 0], [0, 1], [1, 1], [0.5, 0], [0.5, 1]].forEach(function (an) {
          var px = o.x0 + n * an[0], py = o.y + hh * an[1];
          var lo = 1, hi = 1.8, t, f, n2, s2, x2, y2;
          for (t = 0; t < 7; t++) {
            f = (lo + hi) / 2;
            n2 = Math.min(growN, Math.round(n * f));
            s2 = shape(o, n2); x2 = Math.round(px - n2 * an[0]); y2 = py - s2.h * an[1];
            if (n2 > n && x2 >= 0 && x2 <= cols - n2 && isFree(oc, s2, o.d, x2, y2)) {
              if (!bestFit || n2 > bestFit.s.n) bestFit = { s: s2, x0: x2, y: y2 };
              lo = f;
            } else hi = f;
          }
        });
        if (bestFit) { o.s = bestFit.s; o.x0 = bestFit.x0; o.y = bestFit.y; }
      });
    }
    // 2. close the gaps
    settle(); squeeze(); settle(); grow(); settle(); squeeze(); settle(); grow(); settle();

    var bottom = 0, minX = W, maxX = 0;
    items.forEach(function (o) {
      bottom = Math.max(bottom, o.y + o.s.h);
      minX = Math.min(minX, o.x0 * CELL); maxX = Math.max(maxX, (o.x0 + o.s.n) * CELL);
    });
    var shift = (W - (maxX - minX)) / 2 - minX;      // centre the whole cluster
    items.forEach(function (o) {
      o.el.style.left = (o.x0 * CELL + shift) + 'px'; o.el.style.top = o.y + 'px';
      o.el.style.width = (o.s.n * CELL) + 'px'; o.el.style.height = o.s.h + 'px';
    });
    stage.style.height = (bottom + gFrame * 6) + 'px';
  }

  function show(id) {
    var c = null;
    cats.forEach(function (x) { if (x.id === id) c = x; });
    Array.prototype.forEach.call(nav.children, function (a) {
      a.setAttribute('aria-current', c && a.getAttribute('href') === '#' + c.id ? 'true' : 'false');
    });
    stage.innerHTML = ''; stage.style.height = '0px';
    current = c;
    if (!c) return;
    seed = Math.floor(Math.random() * 1e9);
    order = shuffle(c.items.length, rng(seed));
    c.items.forEach(function (it) {
      var el;
      if (it.video) {
        el = document.createElement('video');
        el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true;
        el.setAttribute('muted', ''); el.setAttribute('playsinline', '');
        el.preload = 'metadata';
        el.addEventListener('loadeddata', function () { el.classList.add('on'); });
        el.src = it.src;
      } else {
        el = document.createElement('img');
        el.alt = ''; el.decoding = 'async'; el.loading = 'lazy';
        el.addEventListener('load', function () { el.classList.add('on'); });
        el.src = it.src;
      }
      if (it.t) el.classList.add('cut');
      el.draggable = false;
      stage.appendChild(el);
    });
    layout();
    window.scrollTo(0, 0);
  }

  function route() { show(decodeURIComponent(location.hash.slice(1))); }
  window.addEventListener('hashchange', route);
  var rt; window.addEventListener('resize', function () {
    clearTimeout(rt); rt = setTimeout(layout, 120);
  });
  route();
})();
</script>
</body>
</html>
