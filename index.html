<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kacper Liberda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { color: #000; -webkit-font-smoothing: antialiased; }

  nav {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 0 clamp(12px, 3.2vw, 56px);
    padding: clamp(18px, 3vw, 40px) 16px clamp(10px, 1.6vw, 22px);
  }
  nav a {
    font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
    font-size: clamp(22px, 4.6vw, 64px);
    line-height: 1.05; letter-spacing: .01em;
    color: #000; text-decoration: none; cursor: pointer;
  }
  nav a[aria-current="true"] {
    text-decoration: underline;
    text-decoration-thickness: .055em;
    text-underline-offset: .09em;
  }
  nav a:focus-visible { outline: 2px solid #000; outline-offset: 4px; }

  #stage { position: relative; margin: 0 auto; width: calc(100% - 32px); max-width: 1800px; }
  #stage > * {
    position: absolute; display: block;
    opacity: 0; transition: opacity .5s ease;
  }
  /* cut-outs sit on white: multiply lets their empty corners tuck under neighbours */
  #stage > .cut { mix-blend-mode: multiply; }
  #stage > .on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #stage > * { transition: none; } }
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="stage"></main>

<script src="data.js"></script>
<script>
(function () {
  var nav = document.getElementById('nav');
  var stage = document.getElementById('stage');
  var cats = window.PORTFOLIO || [];
  var current = null, seed = 1, order = [];

  // small seeded RNG so a resize keeps the same arrangement
  function rng(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  cats.forEach(function (c) {
    var a = document.createElement('a');
    a.textContent = c.name;
    a.href = '#' + c.id;
    nav.appendChild(a);
  });

  function shuffle(n, rand) {
    var a = []; for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) {
      var k = Math.floor(rand() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  // Tight scatter. Every item gets a random size and is dropped at the spot
  // (out of many random ones) where it sits highest and leaves the least air.
  // Cut-outs carry their outline (it.t / it.b = top / bottom edge per column),
  // so they nest into each other's shapes; drawn pixels never overlap.
  function layout() {
    if (!current) return;
    var rand = rng(seed * 7919 + 13);
    var W = stage.clientWidth;
    var small = W < 620, mid = W < 1050;
    var CELL = 3, cols = Math.max(1, Math.floor(W / CELL));
    var gFrame = Math.max(6, W * (small ? 0.016 : 0.007));   // gap around photos / framed renders
    var gCut = Math.max(3, W * (small ? 0.008 : 0.003));     // gap around cut-outs
    var aMin = small ? 0.16 : mid ? 0.055 : 0.022;           // item area as share of W*W
    var aMax = small ? 0.34 : mid ? 0.12 : 0.062;
    var maxW = W * (small ? 0.82 : mid ? 0.5 : 0.36);
    var sky = new Float32Array(cols);    // lowest drawn pixel so far, per column
    var need = new Float32Array(cols);   // gap wanted by whatever is there
    var bottom = 0, minX = W, maxX = 0, placed = [];

    order.forEach(function (idx) {
      var it = current.items[idx], el = stage.children[idx];
      var ar = it.w / it.h;
      var area = (aMin + rand() * (aMax - aMin)) * W * W;
      var w = Math.min(Math.sqrt(area * ar), maxW, cols * CELL);
      var h = w / ar;
      var n = Math.max(1, Math.min(cols, Math.round(w / CELL)));
      var g = it.t ? gCut : gFrame;
      var top = new Float32Array(n), bot = new Float32Array(n), c, k;
      for (c = 0; c < n; c++) {
        if (it.t) {
          k = Math.min(it.t.length - 1, Math.floor((c + 0.5) / n * it.t.length));
          if (it.t[k] < 0) { top[c] = -1; bot[c] = -1; }
          else { top[c] = it.t[k] / 100 * h; bot[c] = it.b[k] / 100 * h; }
        } else { top[c] = 0; bot[c] = h; }
      }

      // candidate spots: random ones plus ones flush against what is already placed
      var xs = [], e;
      for (e = 0; e < 40; e++) xs.push(Math.floor(rand() * (cols - n + 1)));
      for (e = 1; e < cols; e++) {
        if (sky[e] !== sky[e - 1]) { xs.push(e); xs.push(e - n); }
      }
      xs.push(0); xs.push(cols - n);
      var base = rand() * W * 0.03, sliver = W * (small ? 0.3 : 0.13);
      var best = null;
      for (var t = 0; t < xs.length; t++) {
        var x0 = xs[t];
        if (x0 < 0 || x0 > cols - n) continue;
        var y = base, s, v;
        for (c = 0; c < n; c++) {
          if (top[c] < 0) continue;
          s = sky[x0 + c];
          if (s > 0) { v = s + Math.max(need[x0 + c], g) - top[c]; if (v > y) y = v; }
        }
        var air = 0, cnt = 0;
        for (c = 0; c < n; c++) {
          if (top[c] < 0) continue;
          air += y + top[c] - sky[x0 + c]; cnt++;
        }
        // empty strip left beside the item that nothing else could use
        var gl = 0, gr = 0;
        for (c = x0 - 1; c >= 0 && sky[c] <= y + h * 0.15; c--) gl++;
        for (c = x0 + n; c < cols && sky[c] <= y + h * 0.15; c++) gr++;
        var waste = (gl > 1 && gl * CELL < sliver ? gl * CELL : 0) + (gr > 1 && gr * CELL < sliver ? gr * CELL : 0);
        var cost = y + 0.7 * (cnt ? air / cnt : 0) + waste * 1.2 + rand() * h * 0.1;
        if (!best || cost < best.cost) best = { x0: x0, y: y, cost: cost };
      }

      // claim the columns, widened sideways by the gap
      var d = Math.ceil(g / CELL);
      for (c = -d; c < n + d; c++) {
        var col = best.x0 + c;
        if (col < 0 || col >= cols) continue;
        var m = -1;
        for (k = Math.max(0, c - d); k <= Math.min(n - 1, c + d); k++) {
          if (top[k] >= 0 && bot[k] > m) m = bot[k];
        }
        if (m >= 0 && best.y + m > sky[col]) { sky[col] = best.y + m; need[col] = g; }
      }
      bottom = Math.max(bottom, best.y + h);
      minX = Math.min(minX, best.x0 * CELL); maxX = Math.max(maxX, (best.x0 + n) * CELL);
      placed.push([el, best.x0 * CELL]);
      el.style.top = best.y + 'px';
      el.style.width = (n * CELL) + 'px'; el.style.height = (n * CELL / ar) + 'px';
    });
    // centre the whole cluster
    var shift = (W - (maxX - minX)) / 2 - minX;
    placed.forEach(function (p) { p[0].style.left = (p[1] + shift) + 'px'; });
    stage.style.height = (bottom + gFrame * 4) + 'px';
  }

  function show(id) {
    var c = null;
    cats.forEach(function (x) { if (x.id === id) c = x; });
    Array.prototype.forEach.call(nav.children, function (a) {
      a.setAttribute('aria-current', c && a.getAttribute('href') === '#' + c.id ? 'true' : 'false');
    });
    stage.innerHTML = ''; stage.style.height = '0px';
    current = c;
    if (!c) return;
    seed = Math.floor(Math.random() * 1e9);
    order = shuffle(c.items.length, rng(seed));
    c.items.forEach(function (it) {
      var el;
      if (it.video) {
        el = document.createElement('video');
        el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true;
        el.setAttribute('muted', ''); el.setAttribute('playsinline', '');
        el.preload = 'metadata';
        el.addEventListener('loadeddata', function () { el.classList.add('on'); });
        el.src = it.src;
      } else {
        el = document.createElement('img');
        el.alt = ''; el.decoding = 'async'; el.loading = 'lazy';
        el.addEventListener('load', function () { el.classList.add('on'); });
        el.src = it.src;
      }
      if (it.t) el.classList.add('cut');
      el.draggable = false;
      stage.appendChild(el);
    });
    layout();
    window.scrollTo(0, 0);
  }

  function route() { show(decodeURIComponent(location.hash.slice(1))); }
  window.addEventListener('hashchange', route);
  var rt; window.addEventListener('resize', function () {
    clearTimeout(rt); rt = setTimeout(layout, 120);
  });
  route();
})();
</script>
</body>
</html>
